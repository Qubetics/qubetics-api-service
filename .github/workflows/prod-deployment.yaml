name: '[prod] Deploy testnet qubetics api'

on: 
  push:
    branches: 
      - prod

jobs:
  deploy_testnet_qubetics_api_service:
    uses: ./.github/workflows/qubetics-api.yaml
    with:
      SWR_ORGANIZATION: testnet-qubetics
      ARGOCD_BRANCH: prod
      HUAWEI_REGION: 'ap-southeast-1'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Evm-backend/qubetics-api-deployment.yaml
      HUAWEI_IMAGE: prod-qubetics-evm-backend
      DOCKER_USERNAME: ap-southeast-1@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.PROD_QUBETICS_API_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
