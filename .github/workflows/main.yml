name: Docker Build

on:
  push:
    branches:
      - dev
      - main
      - master
      - feature/ci-cd

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/dev' && 'dev' || github.ref == 'refs/heads/main' && 'main' || 'prod' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set environment variables for dev or qa
        id: set-env-vars
        run: |
          # Use $GITHUB_REF directly (provided by GitHub Actions) instead of ${{ github.ref }} inside the script
          if [[ "$GITHUB_REF" == "refs/heads/dev" || "$GITHUB_REF" == "refs/heads/qa" ]]; then
            echo "Using environment based on branch"
            echo "HUAWEI_SWR_API=${{ secrets.HUAWEI_SWR_API }}" >> $GITHUB_ENV 
            echo "HUAWEI_IMAGE=${{ secrets.HUAWEI_IMAGE }}" >> $GITHUB_ENV
            echo "HUAWEI_SWR_ENDPOINT=${{ secrets.HUAWEI_SWR_ENDPOINT }}" >> $GITHUB_ENV
            echo "HUAWEI_ORGANIZATION=${{ secrets.HUAWEI_ORGANIZATION }}" >> $GITHUB_ENV
            echo "ARGOCD_REPO=${{ secrets.ARGOCD_REPO }}" >> $GITHUB_ENV
            echo "DEPLOYMENT_PATH=${{ secrets.DEPLOYMENT_PATH }}" >> $GITHUB_ENV
            echo "GIT_USERNAME=${{ secrets.GIT_USERNAME }}" >> $GITHUB_ENV
            echo "GIT_EMAIL=${{ secrets.GIT_EMAIL }}" >> $GITHUB_ENV
            echo "BRANCH=${{ secrets.BRANCH }}" >> $GITHUB_ENV
          else
            echo "Not in dev or qa branch, skipping Docker build"
            exit 0
          fi

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client        

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const core = require('@actions/core')
            let id_token = await core.getIDToken("dev-qubetics")
            core.setOutput('id_token', id_token)

      - name: Getting credentials
        id: login
        run: |
          unscoped_token=$(curl -ki -s -X POST -H "Authorization: Bearer ${{ steps.idtoken.outputs.id_token }}" \
            https://iam.myhuaweicloud.com/v3/OS-FEDERATION/identity_providers/dev-qubetics-pipeline/protocols/oidc/auth \
            -H "Accept: application/json;" -H "Content-Type: application/json" -d "{}" | grep 'X-Subject-Token:' | awk '{print $2}')
          response=$(curl -ki -s -X POST -H "x-auth-token: ${unscoped_token}" ${HUAWEI_SWR_API}/v2/manage/utils/secret)
          echo "$response"
          dc_header=$(echo "$response" | grep -i 'X-Swr-Dockerlogin:' | cut -d ':' -f2 | sed 's/^ *//;s/ *$//' | tr -d '\r' | tr -d '\n')
          echo "Docker login command: $dc_header"
          echo "dc_login=$dc_header" >> $GITHUB_OUTPUT    

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          docker build -t ${HUAWEI_SWR_ENDPOINT}/${HUAWEI_ORGANIZATION}/${HUAWEI_IMAGE}:${{ github.sha }} .
          
      - name: Docker login & Push Docker image to Huawei SWR
        run: |
          docker login -u ${dc_login% *} -p ${dc_login#* } ${HUAWEI_SWR_ENDPOINT}
          docker push ${HUAWEI_SWR_ENDPOINT}/${HUAWEI_ORGANIZATION}/${HUAWEI_IMAGE}:${{ github.sha }}

      - name: Configure Deploy Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts   
          git clone ${ARGOCD_REPO}
          cd argocd-qubetics          
          git pull origin
          git checkout ${BRANCH}
          sed -i "s|\(image: \).*|\1${HUAWEI_SWR_ENDPOINT}/${HUAWEI_ORGANIZATION}/${HUAWEI_IMAGE}:${{ github.sha }}|" ${DEPLOYMENT_PATH}
          git config user.name ${GIT_USERNAME}
          git config user.email ${GIT_EMAIL}
          git add .
          git commit -m "Update image to ${HUAWEI_SWR_ENDPOINT}/${HUAWEI_ORGANIZATION}/${HUAWEI_IMAGE}:${{ github.sha }}"
          git push origin ${BRANCH}
