name: Simple Docker Build Pipeline

on:
  push:
    branches:
      - master
      - staging
      - feature/*

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Build the Docker image
      - name: Build Docker Image
        run: docker build -t my-app .
