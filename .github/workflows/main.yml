name: Huawei SWR Docker Build and Push

on:
  push:
    branches:
      - main
      - staging
      - feature/*

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Log in to Huawei SWR
      - name: Log in to Huawei SWR
        run: |
          docker login -u ${{ secrets.HUAWEI_USERNAME }} -p ${{ secrets.HUAWEI_PASSWORD }} ${{ secrets.HUAWEI_SWR_URL }}
