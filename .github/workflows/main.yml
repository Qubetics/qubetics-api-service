name: Build and Push Docker Image with OIDC

on:
  push:
    branches:
      - master
      - feature/*

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const core = require('@actions/core');
            const token = await github.getOctokit(process.env.GITHUB_TOKEN).request('POST /user');
            const id_token = await github.actions.getIDToken("dev-qubetics-pipeline");
            core.setOutput("id_token", id_token);
