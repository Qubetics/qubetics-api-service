name: Docker Build

on:
  push:
    branches:
      - dev
      - main
      - master
      - feature/*

jobs:
  build:
    if: github.ref == 'refs/heads/feature/ci-cd' || github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/dev' && 'dev' || github.ref == 'refs/heads/main' && 'main' || 'prod' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set environment variables for dev or qa
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" || "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "IMAGE_ID=${{ secrets.IMAGE_ID }}" >> $GITHUB_ENV
          else
            echo "Not in dev or qa branch, skipping Docker build"
            exit 0
          fi

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_ID .
