name: '[testnet] Deploy testnet qubetics api'

on: 
  push:
    branches: 
      - stable-master-v

jobs:
  deploy_testnet_qubetics_api_service:
    uses: ./.github/workflows/qubetics-api.yaml
    with:
      SWR_ORGANIZATION: testnet-qubetics
      ARGOCD_BRANCH: testnt_v2
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Evm-backend/qubetics-api-deployment.yaml
      HUAWEI_IMAGE: testnet-qubetics-api
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.TESTNET_V2_QUBETICS_API_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_TESTNET }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
