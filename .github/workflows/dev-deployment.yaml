name: '[dev] Deploy Qubetics api'

on: 
  push:
    branches: 
      - stable-master-v2

jobs:
  dev_deploy_Qubetics_api:
    uses: ./.github/workflows/qubetics-api.yaml
    with:
      SWR_ORGANIZATION: dev-qubetics
      ARGOCD_BRANCH: dev
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Evm-backend/api-deployment.yaml
      HUAWEI_IMAGE: dev-qubetics-api
      DOCKER_USERNAME: ap-southeast-3@HPUAJWWFSLCMD312AZSR
      ENV: ${{ vars.DEV_QUBETICS_API_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_NEW }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY_NEW }}
